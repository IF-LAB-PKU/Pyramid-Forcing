# Pyramid Forcing — recommended inference config (public release).
#
# Per-head adaptive KV-cache strategy:
#   osc   (label -1): sink1 + cyclic(period=6, bucket_cap=4) + recent4
#   sta+  (label  1): sink3 + stride(interval=6,  cap=4)     + recent4
#   sta-  (label  2): sink3 + merge(patch_size=2, cap=4)     + recent4
#
# This config is for INFERENCE only. Training-side fields (FSDP, wandb,
# optimizers, EMA, distillation) live in configs/self-forcing.yaml
# and friends — kept separate so a casual user reading this file isn't
# distracted by knobs that don't affect generation.
#
# Override at the CLI rather than editing the YAML when possible:
#   --checkpoint_path  -- overrides nothing here (loaded directly)
#   --data_path        -- overrides ``data_path`` below
#   --output_folder    -- where mp4s go
#   --num_output_frames -- changes the latent frame count
#   --use_ema          -- pick the EMA branch of the checkpoint

# ---------------------------------------------------------------------------
# Sampling
# ---------------------------------------------------------------------------
denoising_step_list: [1000, 750, 500, 250]   # 4 denoise steps + 1 clean pass
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
mixed_precision: true
seed: 0

# Wan2.1 1.3B default negative prompt (Chinese, taken from upstream Wan2.1).
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

# Latent shape (B, frames, channels, H, W). frames=21 → ~84 video frames after
# VAE decode at 480×832. Override the frame count via --num_output_frames.
image_or_video_shape: [1, 21, 16, 60, 104]

# ---------------------------------------------------------------------------
# Generation pipeline
# ---------------------------------------------------------------------------
num_frame_per_block: 3                       # autoregressive block size
compile_ffn: true                            # Triton/torch.compile the FFN
data_path: prompts/MovieGenVideoBench_num128.txt   # default prompts; CLI overrides

model_kwargs:
  local_attn_size: -1                        # -1 = full attention; Pyramid Forcing handles compression
  timestep_shift: 5.0

# ---------------------------------------------------------------------------
# HeadKV — adaptive per-head KV caching
# ---------------------------------------------------------------------------
use_headkv: true
use_adaptive_headkv: true
headkv_config_path: configs/head_configs/best_labels.csv
headkv_policy_csv_path: configs/head_configs/best_labels.csv
headkv_default_capacity: 32760
headkv_frame_seq_length: 1560
headkv_code_map:
  '-1': 32760
  '1':  32760
  '2':  32760

headkv_capture_frame_id_mode: mapped
headkv_readout_cache_enabled: true
headkv_prompt_v_cache_enabled: false
headkv_dynamic_capacity: 31200
headkv_sink_tokens: 4680
decoupled_sink_tokens: 0
sink_grid_decoupling: true

# Dynamic RoPE: remap stale positions back into the 21-frame training range.
headkv_dynamic_rope_mode: window_clamp
sink_time_clamp_min: 18
sink_time_clamp_max: 21
decoupled_sink_time_lag: 0
history_time_mapping_mode: none
history_relative_t_max: 21
history_time_soft_factor: 1.0

# ---------------------------------------------------------------------------
# Middle strategies — three sub-policies, dispatched per head via labels.
# ---------------------------------------------------------------------------
cyclic_enabled: true
cyclic_period: 6
cyclic_bucket_cap: 4
cyclic_osc_only: true
cyclic_dynamic_rope: true

stride_enabled: true
stride_interval: 6
stride_capacity: 4
stride_dynamic_rope: true

merge_enabled: true
merge_patch_size: 2
merge_capacity: 4
merge_dynamic_rope: true

lag_enabled: false
headkv_lag_offsets: []
headkv_lag_history: 21
lag_dynamic_rope: false

# ---------------------------------------------------------------------------
# Per-head capacities (sink + middle + recent are summed at runtime).
# ---------------------------------------------------------------------------
headkv_osc_sink_frames: 1
headkv_stable_sink_frames: 3
headkv_recent_frames: 4
headkv_stable_recent_frames: 4
headkv_stable_policy_enabled: true

# Label → middle-strategy routing. Keys are CSV labels (-1/1/2).
headkv_label_phase_bucket_map:
  '-1': 4     # osc heads get cyclic with 4 buckets
  '1':  0     # sta+ heads disable cyclic
  '2':  0     # sta- heads disable cyclic
headkv_label_stride_enabled_map:
  '1': true   # sta+ heads use stride
  '2': false
headkv_label_stride_interval_map:
  '1': 6
headkv_label_merge_enabled_map:
  '-1': false
  '1':  false
  '2':  true  # sta- heads use merge
headkv_label_merge_patch_size_map:
  '2': 2
headkv_label_merge_capacity_map:
  '2': 4
headkv_label_sink_frames_map:
  '-1': 1
  '1':  3
  '2':  3
headkv_label_recent_frames_map:
  '-1': 4
  '1':  4
  '2':  4

update_interval: 1
headkv_disable_osc_sink: false
