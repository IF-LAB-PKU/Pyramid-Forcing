<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1100" />
  <title>Pyramid Forcing</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f5f5f5; }
    body {
      display: flex; justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-optical-sizing: auto;
      font-feature-settings: 'kern', 'liga';
    }
    #root { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    CDN scripts are pinned to exact versions on purpose. The unpinned "latest"
    @babel/standalone rolled over to Babel 8, which changed the React preset's
    default JSX runtime from "classic" to "automatic". The automatic runtime
    emits `import { jsx } from "react/jsx-runtime"`, which is illegal inside a
    classic <script type="text/babel"> and silently blanked the whole page.
  -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
  <script>
    // Force the classic JSX runtime (React.createElement) so the UMD React
    // global is used. This keeps the page working even if the Babel pin is
    // later bumped to 8.x, where "automatic" is the default.
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>
  <script type="text/babel" data-presets="react-classic" src="./app.jsx"></script>
  <script type="text/babel" data-presets="react-classic">
    ReactDOM.createRoot(document.getElementById('root')).render(<PyramidForcingApp />);
  </script>
</body>
</html>
